# Builds the two patched Kafka jars once, then stamps them into the Strimzi image for both
# architectures. Java jars are architecture neutral, so one build feeds both platforms; only
# the base image differs per platform and buildx picks that itself.
name: strimzi-mm2-patched

on:
  workflow_dispatch:
    inputs:
      kafka_version:
        description: Kafka version, must match the jar names in the image
        default: "4.3.0"
      strimzi_image:
        description: Base image to patch
        default: "quay.io/strimzi/kafka:1.1.0-kafka-4.3.0"
      image_tag:
        description: Tag to publish under
        default: "1.1.0-kafka-4.3.0-metricfix1"
  push:
    branches: [ "mm2-metric-loss-fix-4.3.0" ]

env:
  KAFKA_VERSION: ${{ github.event.inputs.kafka_version || '4.3.0' }}
  STRIMZI_IMAGE: ${{ github.event.inputs.strimzi_image || 'quay.io/strimzi/kafka:1.1.0-kafka-4.3.0' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || '1.1.0-kafka-4.3.0-metricfix1' }}

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # The jars replace files inside the Strimzi image, so their version has to be the image's
      # version exactly. Branching off trunk instead of the tag builds 4.3.2-SNAPSHOT jars that
      # would either fail to copy or, worse, be renamed into a 4.3.0 distribution. Check it
      # before the build, so the run fails in seconds instead of after the compile.
      - name: the checkout must be the image's Kafka version
        run: |
          set -euo pipefail
          built=$(sed -n 's/^version=//p' gradle.properties)
          echo "gradle.properties says: $built, image needs: $KAFKA_VERSION"
          if [ "$built" != "$KAFKA_VERSION" ]; then
            echo "::error::this branch builds $built but the image carries $KAFKA_VERSION."
            echo "::error::branch off the tag: git checkout -b <branch> $KAFKA_VERSION"
            exit 1
          fi

      # Only these two modules carry the fix. A full releaseTarGz would take an hour and
      # produce nothing else the image needs.
      - run: ./gradlew --no-daemon :clients:jar :connect:mirror:jar

      - name: collect the jars
        run: |
          set -euo pipefail
          echo "built artifacts:"
          find clients/build/libs connect/mirror/build/libs -name '*.jar' | sort
          mkdir -p jars
          for f in clients/build/libs/kafka-clients-${KAFKA_VERSION}.jar \
                   connect/mirror/build/libs/connect-mirror-${KAFKA_VERSION}.jar; do
            [ -f "$f" ] || { echo "::error::missing $f, see the listing above"; exit 1; }
            cp "$f" jars/
          done
          sha256sum jars/*.jar | tee jars/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: patched-jars
          path: jars/

  image:
    needs: jars
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patched-jars
          path: docker/strimzi-patched/jars
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/strimzi-patched
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            STRIMZI_IMAGE=${{ env.STRIMZI_IMAGE }}
            KAFKA_VERSION=${{ env.KAFKA_VERSION }}
          tags: ghcr.io/${{ github.repository_owner }}/strimzi-kafka:${{ env.IMAGE_TAG }}
